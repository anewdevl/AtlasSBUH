[project]
name = "atlas-python-backend"
version = "0.1.0"
description = "ATLAS FastAPI backend with budgeted evidence-based business research"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "python-dotenv>=1.0,<2",
  "uvicorn[standard]>=0.30,<1",
]

[tool.uv]
dev-dependencies = []

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
atlas_api = ["registry.json"]
